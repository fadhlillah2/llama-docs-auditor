[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    # Exclude virtual environments
    venv
    | env
    | .env
    | .venv
    # Exclude build directories
    | build
    | dist
    | .eggs
    # Exclude cache directories
    | __pycache__
    | .pytest_cache
    | .mypy_cache
    | .tox
    # Exclude notebooks (if any)
    | \.ipynb_checkpoints
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["backend", "rag"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [
    "venv",
    "env", 
    ".env",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "build",
    "dist",
    ".eggs"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "venv",
    "env",
    ".env", 
    ".venv",
    "__pycache__",
    "build",
    "dist"
]

[tool.pytest.ini_options]
testpaths = ["backend", "rag"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"